<!DOCTYPE html>
<html lang="vi">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Đăng ký cầu thủ · KUL</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#F2F2F7;--card:#fff;--text:#111;--muted:#667;--fill:rgba(120,120,128,.12);--tint:#d26319;--ok:#1E8A3A;--okbg:#e3f5e8;--warn:#9a5b00;--warnbg:#fff2cc;--bad:#c4001a;--badbg:#fde7ea}
*{box-sizing:border-box}body{margin:0 auto;max-width:640px;padding:14px 14px 60px;background:var(--bg);color:var(--text);font:15px -apple-system,system-ui,Segoe UI,Roboto,sans-serif}
h1{font-size:24px;margin:6px 0 2px}.sub{color:var(--muted);font-size:13px}.card{background:var(--card);border-radius:16px;padding:14px;margin:12px 0}
.p{display:flex;gap:10px;align-items:flex-start;border-bottom:1px solid #eee;padding:10px 0}.p:last-child{border:0}.so{min-width:36px;height:36px;border-radius:10px;background:var(--fill);display:flex;align-items:center;justify-content:center;font-weight:800}
.p .t{flex:1}.p b{display:block}.badge{display:inline-block;border-radius:8px;padding:2px 8px;font-size:12px;font-weight:700;margin-top:3px}.ok{background:var(--okbg);color:var(--ok)}.cho{background:var(--warnbg);color:var(--warn)}.bad{background:var(--badbg);color:var(--bad)}
label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:12px 0 5px}input,select{width:100%;font:inherit;padding:11px;border:1px solid #d5d9e0;border-radius:10px;background:#fff}
input[type=checkbox]{width:auto;margin-right:8px}.chk{display:flex;align-items:flex-start;font-weight:400;color:var(--text)}
button{font:inherit;border:0;border-radius:12px;padding:12px 14px;cursor:pointer;background:var(--fill)}button.main{width:100%;background:var(--tint);color:#fff;font-weight:800;margin-top:14px}button:disabled{opacity:.5}
.link{background:none;color:var(--muted);text-decoration:underline;padding:4px 0;margin-left:8px;font-size:13px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--fill);border-radius:12px;padding:3px}.tabs button{background:none;padding:9px}.tabs .on{background:#fff;font-weight:800}
.prev{display:flex;gap:10px;margin-top:8px}.prev img{max-width:48%;max-height:160px;border-radius:10px;border:1px solid #ddd}.note{font-size:13px;color:var(--muted);line-height:1.45}.okbox{background:var(--okbg);color:var(--ok);padding:10px;border-radius:10px;margin-top:10px;font-weight:600}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#222;color:#fff;padding:11px 16px;border-radius:999px;opacity:0;transition:.25s;max-width:92vw;text-align:center;pointer-events:none}#toast.show{opacity:1}#toast.bad{background:var(--bad)}
</style>
</head>
<body>
<div id="iab" class="card" style="display:none;background:#fff2cc;color:#7a4b00"></div>
<div id="app"><p class="sub">Đang tải…</p></div>
<div id="toast" role="status"></div>
<p class="note" style="text-align:center;font-size:11px">KUL V250 · web</p>
<script src="kul-api.js?v=V250"></script>
<script>
var KEY=KUL_QS.get('k')||'',INIT=null;
/* Mở trong Zalo / Messenger / Facebook / Instagram / TikTok: trình duyệt nhúng hay chặn gửi dữ liệu → hướng dẫn mở bằng Chrome / Safari */
var IAB=/FBAN|FBAV|FB_IAB|Messenger|Instagram|Zalo|Line\/|TikTok|musical_ly|; wv\)/i.test(navigator.userAgent||'');
function moTrinhDuyet(ly){var b=document.getElementById('iab');b.style.display='block';
  b.innerHTML='<b>⚠ '+(ly||'Trang đang mở trong ứng dụng chat (Zalo / Messenger…), có thể không gửi được hồ sơ.')+'</b><br>Bấm nút <b>⋯</b> hoặc <b>⋮</b> ở góc trên → chọn <b>“Mở bằng trình duyệt”</b> (Chrome / Safari). Hoặc bấm nút dưới để sao chép link rồi dán vào Chrome / Safari.'+
  '<br><button class="main" style="margin-top:8px" onclick="saoLink()">📋 Sao chép link</button>';}
function saoLink(){var u=location.href;try{u=window.top.location.href;}catch(e){}
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(u).then(function(){toast('Đã sao chép link — dán vào Chrome / Safari.');},function(){prompt('Sao chép link này:',u);});else prompt('Sao chép link này:',u);}
if(IAB)moTrinhDuyet();
var D=null,tab='moi',nopLaiId=null,anh={},check=null,busy=false;
function $(i){return document.getElementById(i);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function toast(t,bad){var e=$('toast');e.textContent=t;e.className='show'+(bad?' bad':'');clearTimeout(toast.t);toast.t=setTimeout(function(){e.className='';},3800);}
function msg(e){return String(e&&e.message||e).replace(/^Exception:\s*/,'');}
function run(fn,args,ok){busy=true;ve();var r=google.script.run.withSuccessHandler(function(x){busy=false;ok(x);}).withFailureHandler(function(e){busy=false;ve();toast(msg(e),true);if(/network|unable|failed|authorization|quyền|không thể/i.test(msg(e)))moTrinhDuyet('Gửi không được.');});r[fn].apply(r,args);}
function tai(){
  if(typeof google==='undefined'||!google.script||!google.script.run){if(!D)$('app').innerHTML='<div class="card bad">Trình duyệt này không chạy được trang đăng ký.</div>';moTrinhDuyet('Trình duyệt này chặn trang đăng ký.');return;}
  var xong=false;setTimeout(function(){if(!xong&&!D){$('app').innerHTML='<div class="card bad">Tải quá lâu — mạng yếu hoặc trình duyệt chặn.</div>';moTrinhDuyet('Không tải được danh sách.');}},20000);
  google.script.run.withSuccessHandler(function(r){xong=true;D=r;ve();}).withFailureHandler(function(e){xong=true;if(!D)$('app').innerHTML='<div class="card bad">'+esc(msg(e))+'</div>';else toast(msg(e),true);if(/network|mạng|unable|không thể|failed|authorization|quyền/i.test(msg(e)))moTrinhDuyet('Không kết nối được máy chủ KUL.');}).ctDoi(KEY);}
/* Nén ảnh trên máy trước khi gửi (ảnh điện thoại 3–8MB → ~200–500KB) */
function nen(file,max,q){return new Promise(function(ok,fail){var img=new Image(),url=URL.createObjectURL(file);img.onload=function(){var s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);ok(c.toDataURL('image/jpeg',q));};img.onerror=function(){fail(new Error('Không đọc được ảnh, hãy chụp lại.'));};img.src=url;});}
function chonAnh(input,loai){var f=input.files&&input.files[0];if(!f)return;
  var p=loai==='giayTo'?nen(f,1800,0.85).then(function(x){anh.giayTo=x;}):Promise.all([nen(f,1024,0.82),nen(f,240,0.75)]).then(function(x){anh.anh=x[0];anh.anhNho=x[1];});
  p.then(function(){ve();}).catch(function(e){toast(msg(e),true);});}
function badge(c){var t=c.trangThai;return '<span class="badge '+(t==='Đã duyệt'?'ok':t==='Từ chối'?'bad':'cho')+'">'+esc(t==='Đã duyệt'?'✅ Đã duyệt':t==='Từ chối'?'❌ Từ chối':'⏳ Chờ BTC duyệt')+'</span>';}
function ve(){if(!D)return;var h='',lt=D.luaTuoi;
  h+='<h1>'+esc(D.doi)+'</h1><div class="sub">Nhóm '+esc(D.nhom)+' · Giải '+esc(D.giai)+(lt?' · Năm sinh hợp lệ: '+lt.tu+(lt.den!==lt.tu?'–'+lt.den:''):'')+'</div>';
  var L=D.lich;
  if(L&&L.tran&&L.tran.length){h+='<div class="card" style="border:2px solid var(--tint)"><b>⏰ Lịch thi đấu của đội</b><div class="sub" style="margin:2px 0 6px">Theo giờ thực tế của BTC — có thể thay đổi trong ngày, mở lại link để xem giờ mới nhất.</div>';
    L.tran.forEach(function(t){h+='<div class="p"><div class="so" style="min-width:58px">'+esc(t.gio)+'</div><div class="t"><b>'+(t.live?'🔴 ':'')+esc(t.tran)+(t.san?' · Sân '+esc(t.san):'')+'</b><span class="sub">Gặp '+esc(t.doiThu)+(t.kq?' · Kết quả '+esc(t.kq):'')+'</span></div></div>';});
    h+='<div class="okbox" style="background:var(--warnbg);color:var(--warn)">⚠️ BTC yêu cầu đội có mặt <b>sớm '+L.lenSom+' phút</b> để chuẩn bị — trước <b>'+esc(L.coMat)+'</b>.</div></div>';}
  else if(L)h+='<div class="card" style="background:var(--warnbg);color:var(--warn)">🗓 Lịch thi đấu sẽ được cập nhật vào <b>'+esc(L.capNhat)+'</b>. Mở lại link này để xem giờ thi đấu của đội.</div>';
  if(D.khoa)h+='<div class="card bad">🔒 BTC đã khoá nhận hồ sơ. Liên hệ BTC nếu cần bổ sung.</div>';
  h+='<div class="card"><b>Danh sách cầu thủ ('+D.cauThu.length+'/'+D.toiDa+')</b>';
  if(!D.cauThu.length)h+='<p class="note">Chưa có cầu thủ. Thêm ở bên dưới.</p>';
  D.cauThu.forEach(function(c){h+='<div class="p"><div class="so">'+(c.soAo===''||c.soAo==null?'–':esc(c.soAo))+'</div><div class="t"><b>'+esc(c.ten)+'</b><span class="sub">'+esc(c.ngaySinh)+' · Mã KUL: '+esc(c.id)+'</span><br>'+badge(c)+
    (c.dungTuoi===false?' <span class="badge bad">Năm sinh ngoài lứa tuổi</span>':'')+(c.lyDo?'<div class="note" style="color:var(--bad)">Lý do: '+esc(c.lyDo)+'</div>':'')+
    (!D.khoa&&c.trangThai!=='Đã duyệt'?'<button class="link" onclick="nopLai(\''+esc(c.id)+'\')">Sửa / nộp lại hồ sơ</button> · ':'')+
    (!D.khoa?'<button class="link" onclick="xoa(\''+esc(c.id)+'\',\''+esc(c.ten).replace(/'/g,'')+'\')">Xoá khỏi đội</button>':'')+'</div></div>';});
  h+='</div>';
  if(!D.khoa&&D.cauThu.length<D.toiDa||nopLaiId)h+=form();
  h+='<p class="note">🔐 Ảnh và giấy tờ chỉ BTC KUL xem để xác nhận lứa tuổi, không công khai. Hồ sơ được duyệt sẽ lưu với <b>Mã KUL</b> — giải sau chỉ cần nhập mã (hoặc họ tên + ngày sinh), không phải nộp lại giấy tờ.</p>';
  $('app').innerHTML=h;
}
function form(){var c=nopLaiId&&D.cauThu.filter(function(x){return x.id===nopLaiId;})[0],h='<div class="card">';
  if(c)h+='<b>Sửa / nộp lại hồ sơ: '+esc(c.ten)+'</b> <button class="link" onclick="nopLaiId=null;anh={};ve()">Huỷ</button><p class="note">Sửa họ tên, ngày sinh nếu nhập sai và chụp lại 2 ảnh. Mã KUL giữ nguyên, hồ sơ quay về chờ BTC duyệt.</p>';
  else h+='<div class="tabs"><button class="'+(tab==='moi'?'on':'')+'" onclick="tab=\'moi\';ve()">Cầu thủ mới</button><button class="'+(tab==='ma'?'on':'')+'" onclick="tab=\'ma\';ve()">Đã có mã KUL</button></div>';
  if(!c&&tab==='ma'){h+='<label>Mã KUL</label><input id="ma" placeholder="VD: KUL000123"><label>Ngày sinh (để xác nhận)</label><input id="ns2" type="date"><label>Số áo</label><input id="so2" inputmode="numeric" maxlength="2">'+
    '<button class="main" '+(busy?'disabled':'')+' onclick="themMa()">Thêm vào đội</button></div>';return h;}
  h+='<label>Họ và tên</label><input id="ten" value="'+esc(c?c.ten:($('ten')?$('ten').value:''))+'" onchange="kt()" autocomplete="off">'+
    '<label>Ngày sinh</label><input id="ns" type="date" value="'+esc($('ns')&&$('ns').value?$('ns').value:(c?isoNs(c.ngaySinh):''))+'" onchange="kt()">'+
    (c?'':'<label>Số áo (không bắt buộc)</label><input id="so" inputmode="numeric" maxlength="2" value="'+esc($('so')?$('so').value:'')+'">');
  if(!c&&check&&check.daDuyet){h+='<div class="okbox">✅ Cầu thủ đã có hồ sơ KUL được duyệt ('+esc(check.id)+') — không cần nộp lại giấy tờ.</div><button class="main" '+(busy?'disabled':'')+' onclick="them()">Thêm vào đội</button></div>';return h;}
  h+='<label>Loại giấy tờ chứng minh lứa tuổi</label><select id="loai">'+D.loaiGiayTo.map(function(x){return '<option'+($('loai')&&$('loai').value===x?' selected':'')+'>'+esc(x)+'</option>';}).join('')+'</select>'+
    '<label>Ảnh chân dung (rõ mặt, không đội mũ)</label><input type="file" accept="image/*" capture="user" onchange="chonAnh(this,\'anh\')">'+
    '<label>Ảnh thẻ học sinh / giấy khai sinh — chụp rõ chữ, thấy <b>mộc đỏ</b></label><input type="file" accept="image/*" capture="environment" onchange="chonAnh(this,\'giayTo\')">'+
    '<div class="prev">'+(anh.anh?'<img src="'+anh.anh+'" alt="Ảnh chân dung">':'')+(anh.giayTo?'<img src="'+anh.giayTo+'" alt="Ảnh giấy tờ">':'')+'</div>'+
    '<label class="chk"><input type="checkbox" id="dy"'+($('dy')&&$('dy').checked?' checked':'')+'> Tôi là phụ huynh / người giám hộ, hoặc đại diện đội đã được phụ huynh đồng ý, cho phép BTC KUL lưu thông tin và ảnh này để xác nhận lứa tuổi thi đấu.</label>'+
    '<button class="main" '+(busy?'disabled':'')+' onclick="'+(c?'guiLai()':'them()')+'">'+(busy?'Đang gửi…':(c?'Gửi lại hồ sơ':'Gửi hồ sơ cầu thủ'))+'</button></div>';
  return h;}
function kt(){var t=$('ten').value,n=$('ns').value;if(!t||!n||nopLaiId){check=null;return;}google.script.run.withSuccessHandler(function(r){check=r;ve();}).withFailureHandler(function(){check=null;}).ctKiemTra(KEY,t,n);}
function duLieu(){return {ten:$('ten').value,ngaySinh:$('ns').value,soAo:$('so')?$('so').value:'',loai:$('loai')?$('loai').value:'',anh:anh.anh,anhNho:anh.anhNho,giayTo:anh.giayTo,dongY:!!($('dy')&&$('dy').checked)};}
function isoNs(s){var m=String(s||'').match(/^(\d{2})\/(\d{2})\/(\d{4})$/);return m?m[3]+'-'+m[2]+'-'+m[1]:'';}
function khongDau(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/gi,'d').toLowerCase().replace(/[^a-z0-9]/g,'');}
function them(){var d=duLieu();if(!d.ten||!d.ngaySinh)return toast('Nhập họ tên và ngày sinh.',true);
  var gan=D.cauThu.filter(function(c){return khongDau(c.ten)===khongDau(d.ten)||isoNs(c.ngaySinh)===d.ngaySinh&&khongDau(c.ten).slice(0,6)===khongDau(d.ten).slice(0,6);})[0];
  if(gan&&!confirm('Đội đã có '+gan.ten+' ('+gan.ngaySinh+', '+gan.trangThai+').\n\nNếu lần trước NHẬP SAI, bấm Huỷ rồi dùng "Sửa / nộp lại hồ sơ" ở cầu thủ đó để sửa (hoặc "Xoá khỏi đội" rồi thêm lại).\n\nBấm OK nếu đây là cầu thủ KHÁC.'))return;
  if(!(check&&check.daDuyet)){if(!d.anh||!d.giayTo)return toast('Cần ảnh chân dung và ảnh giấy tờ.',true);if(!d.dongY)return toast('Cần đánh dấu xác nhận đồng ý.',true);}
  run('ctThem',[KEY,d],function(r){D=r;anh={};check=null;toast('Đã gửi hồ sơ. BTC sẽ duyệt sớm.');ve();});}
function guiLai(){var d=duLieu();if(!d.anh||!d.giayTo||!d.dongY)return toast('Cần đủ 2 ảnh và đánh dấu đồng ý.',true);
  run('ctNopLai',[KEY,nopLaiId,d],function(r){D=r;anh={};nopLaiId=null;toast('Đã gửi lại hồ sơ.');ve();});}
function themMa(){var m=$('ma').value,n=$('ns2').value;if(!m||!n)return toast('Nhập mã KUL và ngày sinh.',true);
  run('ctThemTheoMa',[KEY,m,n,$('so2').value],function(r){D=r;toast('Đã thêm cầu thủ.');ve();});}
function nopLai(id){nopLaiId=id;anh={};ve();window.scrollTo(0,document.body.scrollHeight);}
function xoa(id,ten){if(!confirm('Xoá '+ten+' khỏi danh sách đội?'))return;run('ctXoa',[KEY,id],function(r){D=r;toast('Đã xoá.');ve();});}
if(INIT){D=INIT;ve();}else tai();
</script>
</body>
</html>
